name: probe runner
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          nproc; free -g; df -h; swapon --show; lsblk; cat /etc/os-release | head -3
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/lib/jvm /usr/lib/google-cloud-sdk /usr/share/swift /opt/hostedtoolcache /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/az /usr/local/julia* || true
          docker system prune -af > /dev/null 2>&1 || true
          echo AFTER; df -h / /mnt; docker info 2>/dev/null | grep -i "root dir"
